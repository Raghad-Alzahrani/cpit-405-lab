<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7-Unsplash API</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: white;
    }
    header {
        background-color: #f8f9fa;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 2px 4px #ddd;
    }
    header h1 {
        font-size: 24px;
        margin: 0 20px 0 0;
        white-space: nowrap;
    }
    input {
        padding: 12px;
        width: 300px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
    }
    button {
        padding: 12px 15px;
        background-color: #555;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
    }
    button:hover {
        background-color: #333;
    }
    #searchResults {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        max-width: 1560px;
        margin: 0 auto;
        padding: 18px 20px;
    }
    .photo {
        width: 100%;
    }
    .photo img {
        width: 100%;
        height: 500px;
        object-fit: cover;
        border-radius: 7px;
        display: block;
    }
    .photo p {
        display: none;
    }

</style>
</head>

<body>

    <header>
    <h1>Unsplash API</h1>
    <input type="text" id="searchText" value="Makkah">
    <button id="xhrSearch">Search using XHR</button>
    <button id="fetchSearch">Search using fetch (promises)</button>
    <button id="asyncSearch">Search using fetch (async/await)</button>
    </header>
    <div id="searchResults"></div>

    <script>

        const apiKey ="FWNf1Vxbnqpu-ugIZQxpZ0FEnR5Go5iz7vaotUY34FQ";

        let searchText = document.getElementById("searchText");
        let searchResults = document.getElementById("searchResults");
        let btnXHR = document.getElementById("xhrSearch");
        let btnFetch = document.getElementById("fetchSearch");
        let btnAsync = document.getElementById("asyncSearch");

        // Display the images 
        function displayImages(data) {

            searchResults.innerHTML = "";

            if (data.results.length === 0) {
                searchResults.textContent = "No images found.";
                return;
            }

            data.results.forEach(function(photo) {

                let photoDiv = document.createElement("div");
                photoDiv.className = "photo";
                let image = document.createElement("img");
                image.src = photo.urls.regular;
                image.alt = photo.alt_description || "Unsplash photo";
                let credit = document.createElement("p");
                let photographer = document.createElement("a");
                photographer.href = photo.user.links.html +"?utm_source=cpit405_lab7&utm_medium=referral";
                photographer.textContent = photo.user.name;
                photographer.target = "_blank";
                credit.textContent = "Photo by ";
                credit.appendChild(photographer);
                photoDiv.appendChild(image);
                photoDiv.appendChild(credit);

                searchResults.appendChild(photoDiv);

            });
        }

        // XMLHttpRequest
        function searchUsingXHR(keyword) {

            let url = "https://api.unsplash.com/search/photos?query="+ encodeURIComponent(keyword) + "&per_page=30";
            let xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState != 4) {
                    return;
                }
                if (xhr.status === 200) {

                    let data = JSON.parse(xhr.responseText);
                    displayImages(data);

                } else {
                    searchResults.textContent = "Error loading images.";
                }
            };
            xhr.open("GET", url, true);
            xhr.setRequestHeader("Authorization", "Client-ID " + apiKey);
            xhr.send();
        }
        // Fetch with Promises
        function searchUsingFetch(keyword) {
            let url = "https://api.unsplash.com/search/photos?query=" + encodeURIComponent(keyword) + "&per_page=30";
            fetch(url, {headers: {"Authorization": "Client-ID " + apiKey}})
            .then(function(response) {
                if (!response.ok) {
                    throw new Error("Request failed");
                }
                return response.json();

            })
            .then(function(data) {
                displayImages(data);
            })
            .catch(function(error) {
                searchResults.textContent = "Error loading images.";
                console.error(error);
            });
        }
        //Fetch with Async/Await
        async function searchUsingAsync(keyword) {
            let url = "https://api.unsplash.com/search/photos?query="+ encodeURIComponent(keyword) + "&per_page=30";
            try {

                let response = await fetch(url, {headers: {"Authorization": "Client-ID " + apiKey}});
                if (!response.ok) {
                    throw new Error("Request failed");
                }
                let data = await response.json();
                displayImages(data);
            } catch (error) {
                searchResults.textContent = "Error loading images.";
                console.error(error);
            }
        }

        // XHR button click event
        btnXHR.addEventListener("click", function() {
            let keyword = searchText.value.trim();
            if (keyword === "") {
                alert("Please enter a search keyword.");
                return;
            }
            searchResults.textContent = "Loading...";
            searchUsingXHR(keyword);
        });

        // Fetch with Promises button click event
        btnFetch.addEventListener("click", function() {
            let keyword = searchText.value.trim();
            if (keyword === "") {
                alert("Please enter a search keyword.");
                return;
            }
            searchResults.textContent = "Loading...";
            searchUsingFetch(keyword);

        });
        // Fetch with Async/Await button click event
        btnAsync.addEventListener("click", function() {
            let keyword = searchText.value.trim();
            if (keyword === "") {
                alert("Please enter a search keyword.");
                return;
            }
            searchResults.textContent = "Loading...";
            searchUsingAsync(keyword);
        });
        // Search when Enter key is pressed
        searchText.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                btnXHR.click();
            }
        });
    </script>
</body>
</html>
